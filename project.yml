name: Daybreak

options:
  bundleIdPrefix: com.mashoaib
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true

configFiles:
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.7"
    CURRENT_PROJECT_VERSION: "8"
    CODE_SIGN_STYLE: Automatic
    WORKSHOP_PLATFORMS: macOS

packages:
  WorldTimeKit:
    path: WorldTimeKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1

targets:
  Daybreak-iOS:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
      - Icon/AppIcon.icon
    dependencies:
      - package: WorldTimeKit
    info:
      path: iOS/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Daybreak
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.mashoaib.daybreak
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Daybreak
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Daybreak uses your location to show your own time, country and time zone.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"

  Daybreak-macOS:
    type: application
    platform: macOS
    sources:
      - macOS
      - Shared
      - Icon/AppIcon.icon
    dependencies:
      - package: WorldTimeKit
      - package: Sparkle
    entitlements:
      path: macOS/Daybreak.entitlements
      properties:
        com.apple.security.personal-information.location: true
    info:
      path: macOS/Info.plist
      properties:
        SUFeedURL: https://$(DAYBREAK_UPDATES_HOST)/daybreak/appcast.xml
        SUPublicEDKey: $(DAYBREAK_SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_NAME: Daybreak
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.mashoaib.daybreak
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Daybreak
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSLocationUsageDescription: Daybreak uses your location to show your own time, country and time zone.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Daybreak uses your location to show your own time, country and time zone.
